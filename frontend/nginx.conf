map $request_method $bid_write_limit_key {
    default "";
    POST $binary_remote_addr;
    PUT $binary_remote_addr;
}

limit_req_zone $binary_remote_addr zone=bid_api_per_ip:10m rate=60r/m;
limit_req_zone $bid_write_limit_key zone=bid_writes_per_ip:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        limit_req zone=bid_api_per_ip burst=30 nodelay;
        limit_req zone=bid_writes_per_ip burst=10 nodelay;
        limit_req_status 429;

        # Use the unique Compose container name. A legacy local container also
        # owns the generic "backend" alias and caused round-robin old/new APIs.
        proxy_pass http://bid-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Bid-Agent-Edge-Secret ${BID_AGENT_EDGE_SECRET};
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        # Chapter generation is a bounded long request; the model commonly
        # needs 60-120 seconds for evidence-grounded Chinese prose.
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://bid-backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
