services:
  postgres:
    image: docker.m.daocloud.io/pgvector/pgvector:pg16
    container_name: bid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bid_agent}
      POSTGRES_USER: ${POSTGRES_USER:-biduser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biduser -d bid_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: bid-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: docker.m.daocloud.io/library/neo4j:5.26-community
    container_name: bid-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-bid-ontology-local-only}"
      BID_NEO4J_PASSWORD: ${NEO4J_PASSWORD:-bid-ontology-local-only}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p \"$${BID_NEO4J_PASSWORD}\" 'RETURN 1' >/dev/null 2>&1",
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bid-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      NEO4J_ENABLED: ${NEO4J_ENABLED:-true}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-bid-ontology-local-only}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      AI_SLOT_SEMANTIC_RESOLUTION_ENABLED: ${AI_SLOT_SEMANTIC_RESOLUTION_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "python -m app.database.migrate && uvicorn app.main:app --host 0.0.0.0 --port 8000",
      ]
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - document_storage:/app/storage
      - export_storage:/app/exports
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bid-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      AI_SLOT_SEMANTIC_RESOLUTION_ENABLED: ${AI_SLOT_SEMANTIC_RESOLUTION_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: ["python", "-m", "app.workers.workspace_worker"]
    volumes:
      - document_storage:/app/storage
      - export_storage:/app/exports

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bid-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NGINX_ENVSUBST_FILTER: BID_AGENT_EDGE_SECRET
    ports:
      - "127.0.0.1:8080:80"

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  document_storage:
  export_storage:
